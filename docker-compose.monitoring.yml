name: lb-k6

# Stack monitoring TERPISAH dari stack load balancer (project `lb-demo`).
# - `lb-net` dipakai sebagai network external supaya k6 bisa menembak
#   `http://server.localhost` (Traefik) — lihat alias di docker-compose.traefik.yml.
# - `lb-k6-net` untuk Grafana ↔ k6 ↔ Prometheus ↔ Loki (internal saja).
# Jadi `docker compose -p lb-demo down` tidak ikut mematikan dashboard.
#
# Dua penyimpan data (tanpa InfluxDB terpisah):
# - Prometheus → trafik nyata (Traefik + 5 backend + MariaDB) DAN hasil test k6
# - Loki       → log error Traefik + MariaDB + backend

services:
  # Prometheus menyimpan trafik nyata sekaligus menerima remote-write dari k6.
  # Sengaja tidak dipublikasikan ke host dan tidak dirutekan lewat Traefik:
  # konsumennya hanya Grafana dan runner k6 internal.
  prometheus:
    image: prom/prometheus:v3.16.0
    # Image resmi berjalan sebagai `nobody`; socket Docker hanya bisa dibaca
    # root. Ini satu-satunya alasan root dipakai, dan socket-nya read-only.
    user: "0:0"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--config.auto-reload"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      # Read-only: hanya untuk menemukan container backend (docker_sd_configs).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - lb-k6-net
      - lb-net
    restart: unless-stopped

  # Jembatan ke MariaDB untuk metrik server.
  # Catatan penting: saat MariaDB mati, exporter tetap hidup membalas HTTP 200
  # dengan `mysql_up 0` (`up{job="mariadb"}` tetap 1). Dashboard dan alert
  # karena itu wajib memeriksa `mysql_up`, bukan hanya `up`.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    command:
      - "--mysqld.address=mariadb:3306"
      - "--mysqld.username=lb_exporter"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MARIADB_EXPORTER_PASSWORD:-lb_exporter_password}
    networks:
      - lb-k6-net
      - lb-net
    restart: unless-stopped

  # Loki: penyimpanan log container. Tanpa auth dan tanpa port host; hanya
  # Grafana (datasource uid `loki`) yang membacanya. Retensi 7 hari.
  loki:
    image: grafana/loki:3.7.10
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - lb-k6-net
    restart: unless-stopped

  # Alloy: pengirim log container berlabel `lb.logs=true` ke Loki.
  alloy:
    image: grafana/alloy:v1.22.0
    user: "0:0"
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--disable-reporting"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - lb-k6-net
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lb/lb-realtime.json
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.entrypoints: "web"
      traefik.http.routers.grafana.rule: "Host(`grafana.localhost`)"
      traefik.http.routers.grafana.priority: "200"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - lb-k6-net
      - lb-net
    restart: unless-stopped

  # Pemicu Run dari dashboard Grafana.
  # GET /cgi-bin/trigger -> tampilkan halaman konfirmasi + status.
  # POST /cgi-bin/trigger -> mulai satu Run (single-flight), hasil ke Prometheus.
  k6-runner:
    build:
      context: .
      dockerfile: docker/k6-runner.Dockerfile
    environment:
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),avg,min,max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 1s
      RATE: "100"
      DURATION: "15s"
    tmpfs:
      - /tmp
    volumes:
      - ./k6:/scripts:ro
    networks:
      - lb-k6-net
      - lb-net
    labels:
      traefik.enable: "true"
      traefik.http.routers.k6-trigger.entrypoints: "web"
      traefik.http.routers.k6-trigger.rule: "Host(`trigger.localhost`)"
      traefik.http.routers.k6-trigger.priority: "200"
      traefik.http.services.k6-trigger.loadbalancer.server.port: "8080"
    depends_on:
      - prometheus
    restart: unless-stopped

  # k6 tidak ikut `up`; dijalankan sekali pakai (`make k6-run` / `make k6-watch`).
  k6:
    image: grafana/k6:2.4.0
    environment:
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),avg,min,max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 1s
      K6_WEB_DASHBOARD: ${K6_WEB_DASHBOARD:-false}
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PORT: "5665"
      K6_WEB_DASHBOARD_EXPORT: /reports/report.html
      K6_WEB_DASHBOARD_PERIOD: 2s
    ports:
      - "5665:5665"
    volumes:
      - ./k6:/scripts:ro
      - ./monitoring/reports:/reports
    labels:
      traefik.enable: "true"
      traefik.http.routers.k6-web.entrypoints: "web"
      traefik.http.routers.k6-web.rule: "Host(`k6.localhost`)"
      traefik.http.routers.k6-web.priority: "200"
      traefik.http.services.k6-web.loadbalancer.server.port: "5665"
    working_dir: /scripts
    command: ["run", "load-test.js"]
    depends_on:
      - prometheus
    networks:
      - lb-k6-net
      - lb-net

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:

networks:
  lb-k6-net:
    name: lb-k6-net
    driver: bridge
  lb-net:
    external: true
    name: lb-net
