name: lb-k6

# Stack monitoring TERPISAH dari stack load balancer (project `lb-demo`).
# - `lb-net` dipakai sebagai network external supaya k6 bisa menembak
#   `http://server.localhost` (Traefik) — lihat alias di docker-compose.traefik.yml.
# - `lb-k6-net` untuk InfluxDB ↔ Grafana ↔ k6 ↔ Prometheus (internal saja).
# Jadi `docker compose -p lb-demo down` tidak ikut mematikan dashboard.
#
# Tiga sumber data, tiga dashboard:
# - InfluxDB 1.8  → hasil test k6 (dashboard `k6-lb`)
# - Prometheus    → trafik nyata dari Traefik + 5 backend (dashboard `lb-realtime`)
# - Loki          → log error MariaDB + backend (dashboard `db-monitoring`)
#
# Kenapa exporter/Loki/Alloy ada di sini, bukan di stack database:
# `lb-db` sengaja hanya berisi data (MariaDB + Adminer). Semua yang membaca
# data tinggal di stack monitoring, jadi `npm run db:down` tidak mematikan
# alat pantau, dan MariaDB tetap tidak punya port host maupun rute Traefik.

services:
  # Prometheus menyimpan angka trafik nyata (Traefik + 5 backend).
  # Sengaja tidak dipublikasikan ke host dan tidak dirutekan lewat Traefik:
  # satu-satunya konsumennya Grafana.
  prometheus:
    image: prom/prometheus:latest
    # Image resmi berjalan sebagai `nobody`; socket Docker hanya bisa dibaca
    # root. Ini satu-satunya alasan root dipakai, dan socket-nya read-only.
    user: "0:0"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      # Read-only: hanya untuk menemukan container backend (docker_sd_configs).
      # Prometheus tidak bisa membuat/mengubah container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - lb-k6-net
      - lb-net
    restart: unless-stopped

  # Satu-satunya jembatan ke MariaDB untuk metrik server.
  # - Di `lb-net` supaya bisa menjangkau `mariadb:3306`; MariaDB sendiri tetap
  #   tanpa port host dan tanpa rute Traefik.
  # - Di `lb-k6-net` supaya Prometheus (target statis `mysqld-exporter:9104`)
  #   bisa men-scrape-nya. Tidak ada port yang dipublikasikan ke host.
  # - User `lb_exporter` dibuat oleh `npm run db:grant-exporter`
  #   (butuh PROCESS + REPLICATION CLIENT; `lb_app` tidak punya PROCESS).
  # Kalau MariaDB mati, exporter bisa berhenti; `restart` membuatnya menyambung
  # lagi sendiri begitu database hidup, tanpa perlu `docker compose up` ulang.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    command:
      - "--mysqld.address=mariadb:3306"
      - "--mysqld.username=lb_exporter"
      # Tanpa flag kolektor: metrik standar (global_status, global_variables,
      # innodb_*, slave_*) sudah cukup untuk dashboard dan alert.
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MARIADB_EXPORTER_PASSWORD:-lb_exporter_password}
    networks:
      - lb-k6-net
      - lb-net
    restart: unless-stopped

  influxdb:
    image: influxdb:1.8
    environment:
      # Database dibuat otomatis; k6 menulis ke sini lewat output `influxdb`.
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - lb-k6-net
    healthcheck:
      test: ["CMD-SHELL", "influx -execute 'SHOW DATABASES' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Loki: penyimpanan log container. Tanpa auth dan tanpa port host; hanya
  # Grafana (datasource uid `loki`) yang membacanya. Retensi 7 hari.
  loki:
    image: grafana/loki:latest
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - lb-k6-net
    restart: unless-stopped

  # Alloy: pengirim log container berlabel `lb.logs=true` ke Loki.
  # Membaca Docker API lewat socket (read-only), bukan file log host, karena
  # Docker Desktop di Windows tidak membagikan /var/lib/docker/containers.
  # Root hanya untuk membaca socket; tidak ada akses tulis ke Docker.
  alloy:
    image: grafana/alloy:latest
    user: "0:0"
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--disable-reporting"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - lb-k6-net
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Viewer anonim supaya dashboard bisa dibuka tanpa login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/k6/k6.json
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      traefik.enable: "true"
      # Prioritas 200 > router "demo" (1) yang menangkap semua host sebagai fallback.
      traefik.http.routers.grafana.entrypoints: "web"
      traefik.http.routers.grafana.rule: "Host(`grafana.localhost`)"
      traefik.http.routers.grafana.priority: "200"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    depends_on:
      influxdb:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - lb-k6-net
      - lb-net
    restart: unless-stopped

  # Pemicu Run dari dashboard Grafana: satu klik di link "Run k6".
  # Tidak memakai Docker socket; k6 dijalankan langsung di container ini.
  # GET /cgi-bin/trigger -> mulai satu Run, hasil masuk InfluxDB.
  k6-runner:
    build:
      context: .
      dockerfile: docker/k6-runner.Dockerfile
    environment:
      K6_OUT: influxdb=http://influxdb:8086/k6
      RATE: "1000"
      DURATION: "15s"
    volumes:
      - ./k6:/scripts:ro
    networks:
      - lb-k6-net
      - lb-net
    labels:
      traefik.enable: "true"
      traefik.http.routers.k6-trigger.entrypoints: "web"
      traefik.http.routers.k6-trigger.rule: "Host(`trigger.localhost`)"
      traefik.http.routers.k6-trigger.priority: "200"
      traefik.http.services.k6-trigger.loadbalancer.server.port: "8080"
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # k6 tidak ikut `up`; dijalankan sekali pakai:
  #   docker compose -p lb-k6 -f docker-compose.monitoring.yml run --rm k6
  k6:
    image: grafana/k6:2.4.0
    environment:
      # Output metrik ke InfluxDB (lihat catatan deprecation di README).
      K6_OUT: influxdb=http://influxdb:8086/k6
      # Live dashboard hanya aktif kalau diminta: `npm run k6:watch`.
      K6_WEB_DASHBOARD: ${K6_WEB_DASHBOARD:-false}
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PORT: "5665"
      K6_WEB_DASHBOARD_EXPORT: /reports/report.html
      # Laporan HTML butuh durasi > 3x periode ini. 2s => run >= ~6s sudah dapat laporan.
      K6_WEB_DASHBOARD_PERIOD: 2s
    ports:
      - "5665:5665"
    volumes:
      - ./k6:/scripts:ro
      - ./monitoring/reports:/reports
    labels:
      traefik.enable: "true"
      # Router ini hanya muncul selama k6 hidup (npm run k6:watch).
      traefik.http.routers.k6-web.entrypoints: "web"
      traefik.http.routers.k6-web.rule: "Host(`k6.localhost`)"
      traefik.http.routers.k6-web.priority: "200"
      traefik.http.services.k6-web.loadbalancer.server.port: "5665"
    working_dir: /scripts
    command: ["run", "load-test.js"]
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - lb-k6-net
      - lb-net

volumes:
  influxdb-data:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:

networks:
  lb-k6-net:
    name: lb-k6-net
    driver: bridge
  lb-net:
    external: true
    name: lb-net
