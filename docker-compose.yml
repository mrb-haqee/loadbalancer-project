name: lb-demo

# Label bersama: satu Traefik service "demo" berisi 3 server milik semua container.
# Router "demo" menerima semua host (fallback) → inilah jalur load balancing,
# termasuk untuk http://server.localhost.
x-demo-labels: &demo-labels
  traefik.enable: "true"
  traefik.http.routers.demo.entrypoints: "web"
  traefik.http.routers.demo.rule: 'Host(`server.localhost`) || (PathPrefix(`/`) && !HostRegexp(`server-[0-9]+[.]localhost`))'
  traefik.http.routers.demo.priority: "1"
  # Wajib eksplisit: tiap container juga punya service "direct-N", jadi Traefik
  # tidak bisa menebak sendiri service mana yang dipakai router "demo".
  traefik.http.routers.demo.service: "demo"
  traefik.http.routers.demo.middlewares: "demo-retry"
  traefik.http.services.demo.loadbalancer.server.port: "3000"
  # Health check aktif ala Traefik, di samping HEALTHCHECK milik Docker.
  traefik.http.services.demo.loadbalancer.healthcheck.path: "/health"
  traefik.http.services.demo.loadbalancer.healthcheck.interval: "2s"
  traefik.http.services.demo.loadbalancer.healthcheck.timeout: "1s"
  # Failover pasif: ulangi request bila server tidak menjawab (mis. container mati).
  traefik.http.middlewares.demo-retry.retry.attempts: "3"
  traefik.http.middlewares.demo-retry.retry.initialinterval: "100ms"

# Label khusus tiap container: router "direct-N" yang dipatok ke satu server saja.
# Prioritas 100 > 1, jadi host server-N.localhost tidak pernah ikut load balancing.
x-direct-1: &direct-1
  traefik.http.routers.direct-1.entrypoints: "web"
  traefik.http.routers.direct-1.rule: "Host(`server-1.localhost`)"
  traefik.http.routers.direct-1.priority: "100"
  traefik.http.routers.direct-1.service: "direct-1"
  traefik.http.services.direct-1.loadbalancer.server.port: "3000"

x-direct-2: &direct-2
  traefik.http.routers.direct-2.entrypoints: "web"
  traefik.http.routers.direct-2.rule: "Host(`server-2.localhost`)"
  traefik.http.routers.direct-2.priority: "100"
  traefik.http.routers.direct-2.service: "direct-2"
  traefik.http.services.direct-2.loadbalancer.server.port: "3000"

x-direct-3: &direct-3
  traefik.http.routers.direct-3.entrypoints: "web"
  traefik.http.routers.direct-3.rule: "Host(`server-3.localhost`)"
  traefik.http.routers.direct-3.priority: "100"
  traefik.http.routers.direct-3.service: "direct-3"
  traefik.http.services.direct-3.loadbalancer.server.port: "3000"

services:
  # Hanya service ini yang mem-build image; server-2/3 memakai image yang sama.
  server-1:
    image: lb-demo-backend:latest
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      BACKEND_ID: server-1
    networks:
      - lb-net
    labels:
      <<: [*demo-labels, *direct-1]
    restart: unless-stopped

  server-2:
    image: lb-demo-backend:latest
    environment:
      BACKEND_ID: server-2
    networks:
      - lb-net
    labels:
      <<: [*demo-labels, *direct-2]
    restart: unless-stopped

  server-3:
    image: lb-demo-backend:latest
    environment:
      BACKEND_ID: server-3
    networks:
      - lb-net
    labels:
      <<: [*demo-labels, *direct-3]
    restart: unless-stopped

  traefik:
    image: traefik:latest
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"      # URL bersih: http://server.localhost & http://server-N.localhost
      - "8088:80"    # cadangan kalau port 80 dipakai aplikasi lain
      - "8089:8080"  # dashboard + API Traefik
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - lb-net
    restart: unless-stopped

# Network terisolasi: tidak menyentuh network project lain
# (proxy, sanmedclinic_internal, shared-api, dll).
networks:
  lb-net:
    name: lb-net
    driver: bridge
