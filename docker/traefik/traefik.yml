api:
  dashboard: true
  # Hanya untuk demo lokal: dashboard tanpa login di port 8089.
  insecure: true

entryPoints:
  web:
    address: ":80"

# Tanpa ini, request yang sudah telanjur dikirim ke container yang baru mati
# akan menunggu selamanya (Traefik default: tanpa timeout), sehingga klien
# menggantung walau middleware retry tersedia. Dengan batas waktu di bawah,
# request gagal cepat lalu diulang ke server lain oleh middleware retry.
serversTransport:
  forwardingTimeouts:
    dialTimeout: "2s"
    responseHeaderTimeout: "2s"
    idleConnTimeout: "30s"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    # Hanya container dengan label traefik.enable=true yang dipakai.
    exposedByDefault: false
    network: "lb-net"
    watch: true

# Metrik Prometheus: dibaca Prometheus (project lb-k6) lewat entrypoint
# "traefik" (port 8080, sama dengan API). Tanpa ini tidak ada angka request
# per router/service untuk dashboard realtime.
metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    # Bucket latensi dibuat lebih rapat dari default agar p95 berguna di demo
    # (default 0.1/0.3/1.2/5 detik terlalu kasar untuk respons < 50 ms).
    buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5]

log:
  level: INFO

accessLog:
  format: common
  # Hanya catat error (4xx/5xx) atau request lambat >= 500ms supaya Loki tidak
  # banjir probe /health dan request statis normal.
  filters:
    statusCodes:
      - "400-599"
    minDuration: "500ms"
