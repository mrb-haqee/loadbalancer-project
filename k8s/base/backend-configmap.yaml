# Konfigurasi non-rahasia backend. Sejak fase 3, database berjalan di dalam
# cluster (MariaDB StatefulSet + MaxScale), jadi backend memakai Service
# `maxscale` - bukan lagi host.docker.internal. Stack Compose tetap memakai
# database Compose sendiri dan tidak terpengaruh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: backend
data:
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "3000"
  DB_HOST: "maxscale"
  DB_PORT: "4006"
  DB_NAME: "lb_demo"
  DB_USER: "lb_app"
  DB_CONNECTION_LIMIT: "10"
  DB_CONNECT_TIMEOUT_MS: "1000"
  LOG_LEVEL: "info"
