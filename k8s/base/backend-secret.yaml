# Kredensial demo. Sama dengan default docker-compose.db.yml, jadi tidak ada
# rahasia baru yang bocor — tetapi di cluster sungguhan jangan simpan Secret
# seperti ini di Git. Latihan lanjutan: SealedSecrets atau External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app: backend
type: Opaque
stringData:
  DB_PASSWORD: "lb_app_password"
