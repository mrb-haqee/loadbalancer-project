# Service ClusterIP: satu nama stabil (`backend`) untuk lima pod yang datang
# dan pergi. Inilah pengganti service "demo" milik Traefik di Compose.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
