apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Semua resource masuk namespace sendiri supaya tidak bercampur dengan
# namespace sistem (kube-system, traefik).
namespace: lb-demo

resources:
  - namespace.yaml
  - backend-configmap.yaml
  - backend-sealedsecret.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-hpa.yaml
  - backend-pdb.yaml
  - backend-ingressroute.yaml
  - quota.yaml
