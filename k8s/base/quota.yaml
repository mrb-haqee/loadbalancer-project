# Batas atas pemakaian namespace, supaya latihan HPA tidak bisa menghabiskan
# RAM laptop. Angkanya longgar: HPA maksimal 10 backend + k6 Job + MaxScale.
#
# LimitRange memberi default pada container yang lupa menulis resources; tanpa
# itu ResourceQuota menolak pod tersebut ("must specify limits.cpu").
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lb-demo-quota
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 2Gi
    limits.cpu: "6"
    limits.memory: 4Gi
    pods: "40"
    persistentvolumeclaims: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lb-demo-defaults
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
