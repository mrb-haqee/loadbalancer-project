# Grafana memakai file provisioning yang sama dengan Compose
# (monitoring/grafana/provisioning + dashboards). ConfigMap-nya dibuat oleh
# `make k8s-monitoring` dari folder itu, jadi dashboard tidak disalin manual.
#
# Yang tidak dipakai di sini: datasource Loki (belum ada Loki in-cluster) dan
# alerting rules (butuh contact point). Datasource Prometheus + tiga dashboard
# sudah cukup untuk membandingkan angka dengan stack Compose.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  labels:
    app: grafana
type: Opaque
stringData:
  # Kredensial demo, sama levelnya dengan dashboard Traefik tanpa login.
  GF_SECURITY_ADMIN_PASSWORD: "admin"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.3.1
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items:
              - key: prometheus.yml
                path: datasources/prometheus.yml
              - key: lb.yml
                path: dashboards/lb.yml
              - key: db.yml
                path: dashboards/db.yml
              - key: k6.yml
                path: dashboards/k6.yml
        - name: dashboards
          configMap:
            name: grafana-dashboards
            items:
              - key: lb-realtime.json
                path: lb/lb-realtime.json
              - key: database.json
                path: db/database.json
              - key: k6.json
                path: k6/k6.json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  entryPoints:
    - web
    - websecure
  tls:
    secretName: monitoring-tls
  routes:
    - match: Host(`grafana.localhost`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  entryPoints:
    - web
    - websecure
  tls:
    secretName: monitoring-tls
  routes:
    - match: Host(`prometheus.localhost`)
      kind: Rule
      services:
        - name: prometheus
          port: 9090
