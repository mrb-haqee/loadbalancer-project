# Monitoring in-cluster: Prometheus + Grafana, tanpa operator.
#
# Tidak ada Loki/Alloy di sini: log tetap dibaca dengan `kubectl logs`. Menambah
# Loki + Alloy berarti DaemonSet, RBAC discovery, dan volume log host - layak
# dipelajari, tetapi bukan syarat untuk memahami metrik. Jalur upgrade: deploy
# Loki single-binary, lalu Alloy DaemonSet dengan discovery `loki.source.kubernetes`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml

# Dashboard dan provisioning tetap satu sumber dengan Compose: folder
# `monitoring/grafana/`. Tidak disalin ke YAML, jadi build perlu
# `--load-restrictor LoadRestrictionsNone` (lihat Makefile).
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-provisioning
    files:
      - prometheus.yml=../../monitoring/grafana/provisioning/datasources/prometheus.yml
      - lb.yml=../../monitoring/grafana/provisioning/dashboards/lb.yml
      - db.yml=../../monitoring/grafana/provisioning/dashboards/db.yml
      - k6.yml=../../monitoring/grafana/provisioning/dashboards/k6.yml
  - name: grafana-dashboards
    files:
      - lb-realtime.json=../../monitoring/grafana/dashboards/lb/lb-realtime.json
      - database.json=../../monitoring/grafana/dashboards/db/database.json
      - k6.json=../../monitoring/grafana/dashboards/k6/k6.json

# traefik-metrics.yaml sengaja tidak masuk daftar ini: ia harus berada di
# namespace traefik, sedangkan kustomization ini memaksa namespace monitoring.
# k8s/gitops/kustomization.yaml yang menggabungkannya.
