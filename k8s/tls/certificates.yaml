# cert-manager membuat Secret `backend-tls` dari Certificate ini, lalu Traefik
# memakainya di entrypoint websecure (host port 18443).
#
# Bedanya dengan Secret biasa: sertifikat diterbitkan dan diperbarui otomatis
# oleh controller, bukan ditempel manual. Masa berlaku 90 hari, diperbarui
# 30 hari sebelum habis.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backend-tls
  namespace: lb-demo
spec:
  secretName: backend-tls
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  dnsNames:
    - server.localhost
  duration: 2160h
  renewBefore: 720h
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-tls
  namespace: monitoring
spec:
  secretName: monitoring-tls
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  dnsNames:
    - grafana.localhost
    - prometheus.localhost
  duration: 2160h
  renewBefore: 720h
