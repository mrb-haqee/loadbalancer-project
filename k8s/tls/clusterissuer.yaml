# Issuer termudah: sertifikat ditandatangani oleh dirinya sendiri. Tidak ada
# ACME/Let's Encrypt karena nama host `.localhost` tidak bisa diverifikasi dari
# internet. Untuk cluster sungguhan, ganti issuerRef ke ClusterIssuer ACME.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
