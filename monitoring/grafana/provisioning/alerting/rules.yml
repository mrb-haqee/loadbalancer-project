apiVersion: 1

# Alert rule Grafana untuk Load Balancer dan Database.
# Belum ada contact point keluar; status firing terlihat langsung di Grafana.

# Rule lama yang sudah tidak ada di `groups` tidak dihapus otomatis oleh Grafana.
# Daftar ini menghapusnya sekali jalan, jadi instalasi yang masih menyimpan rule
# versi topologi lama (satu MariaDB) ikut bersih setelah Grafana restart.
deleteRules:
  - orgId: 1
    uid: mariadb-down

groups:
  - orgId: 1
    name: load-balancer
    folder: Load Balancer
    interval: 30s
    rules:
      - uid: lb-backend-down
        title: Seluruh backend mati
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: count(up{job="backend"} == 1) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 30s
        annotations:
          summary: Tidak ada backend sehat di rotasi
          description: >
            `count(up{job="backend"} == 1)` bernilai 0 selama 30 detik.
            Seluruh request klien akan ditolak. Cek `make docker-ps` dan `make docker-logs`.
        labels:
          severity: critical
          component: load-balancer
        isPaused: false

      - uid: lb-backend-degraded
        title: Kapasitas backend berkurang
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: count(up{job="backend"} == 1) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 30s
        annotations:
          summary: Kurang dari 5 backend berstatus sehat
          description: >
            Sebagian backend keluar dari rotasi. Cek `make docker-ps` untuk
            melihat server mana yang berhenti atau unhealthy.
        labels:
          severity: warning
          component: load-balancer
        isPaused: false

      - uid: lb-5xx-spike
        title: Error 5xx pada Load Balancer
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(rate(traefik_service_requests_total{service="demo@docker",code=~"5.."}[1m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Service Load Balancer menghasilkan respons 5xx
          description: >
            Ada error 5xx pada `demo@docker` selama 1 menit. Cek log `{project=~"lb-traefik|lb-demo"}` di Loki.
        labels:
          severity: warning
          component: load-balancer
        isPaused: false

  - orgId: 1
    name: database
    folder: Database
    interval: 1m
    rules:
      - uid: db-no-primary
        title: Tidak ada node database yang bisa ditulis
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: count(mysql_global_variables_read_only{job="mariadb"} == 0) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 30s
        annotations:
          summary: Tidak ada satu pun node MariaDB dengan read_only=OFF
          description: >
            MaxScale tidak punya master untuk dilayani di port 4006, sehingga
            semua tulis dan baca aplikasi gagal. Cek `make db-status` dan log
            MaxScale (`make db-logs`). Kalau failover juga gagal, promosikan
            manual lewat `maxctrl` lalu `make db-rejoin` node yang tertinggal.
        labels:
          severity: critical
          component: database
        isPaused: false

      - uid: db-multiple-writable
        title: Lebih dari satu node database bisa ditulis
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: count(mysql_global_variables_read_only{job="mariadb"} == 0) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Dua node atau lebih menerima penulisan (risiko split brain)
          description: >
            MaxScale seharusnya memaksa `read_only=ON` pada semua node non-master.
            Kalau ini menyala lebih dari semenit, MaxScale mungkin mati atau
            node bekas primary baru dinyalakan tanpa `make db-rejoin`.
        labels:
          severity: critical
          component: database
        isPaused: false

      - uid: db-node-down
        title: Satu node database tidak terjangkau
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: min by (node) (mysql_up{job="mariadb"}) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Exporter node {{ $labels.node }} tidak bisa login ke MariaDB
          description: >
            `mysql_up{node="{{ $labels.node }}"}` bernilai 0 selama semenit.
            Node ini bisa mati, atau kredensial `lb_exporter` hilang setelah
            volume dibuat ulang (`make db-grant-users`).
        labels:
          severity: warning
          component: database
        isPaused: false

      - uid: db-replica-stopped
        title: Replikasi database berhenti
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: min by (node) (mysql_slave_status_slave_sql_running{job="mariadb"}) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Replika {{ $labels.node }} berhenti menerapkan event
          description: >
            `Slave_SQL_Running=No` pada node ini. Replika seperti ini tidak boleh
            dipromosikan. Perbaiki dengan `make db-rejoin DB_NODE={{ $labels.node }}`.
        labels:
          severity: warning
          component: database
        isPaused: false

      - uid: db-replica-lag
        title: Replika database tertinggal
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: max by (node) (mysql_slave_status_seconds_behind_master{job="mariadb"}) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [10]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Replika {{ $labels.node }} tertinggal lebih dari 10 detik
          description: >
            Lag REPLIKASI ASINKRON, jadi angka ini adalah batas atas data yang
            hilang bila primary mati sekarang (RPO). Lihat `make db-status`.
        labels:
          severity: warning
          component: database
        isPaused: false

      - uid: mariadb-connections-high
        title: Koneksi MariaDB hampir penuh
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: max by (node) (mysql_global_status_threads_connected / mysql_global_variables_max_connections)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.8]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: Pemakaian koneksi MariaDB di atas 80%
          description: >
            `threads_connected / max_connections > 0.8`. Periksa query yang
            menggantung di Adminer atau naikkan `max_connections`.
        labels:
          severity: warning
          component: database
        isPaused: false

      - uid: mariadb-slow-queries
        title: Slow query MariaDB menumpuk
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: increase(mysql_global_status_slow_queries[5m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: Lebih dari 5 slow query dalam 5 menit
          description: >
            `slow_queries` naik cepat. Catatan: slow query log belum diaktifkan;
            angka ini dari status server. Periksa query lewat Adminer.
        labels:
          severity: warning
          component: database
        isPaused: false

      - uid: api-db-errors
        title: Backend gagal mengakses database
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(rate(lb_db_errors_total{code!="ER_DUP_ENTRY"}[2m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: Query database dari backend mulai gagal
          description: >
            Ada `lb_db_errors_total` dengan kode selain `ER_DUP_ENTRY`.
            Cek log backend (`{project="lb-demo"}`) dan status MariaDB.
        labels:
          severity: warning
          component: database
        isPaused: false
