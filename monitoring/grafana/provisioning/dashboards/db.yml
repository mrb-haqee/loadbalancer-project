apiVersion: 1

# Dashboard database (Prometheus + Loki) dipisah dari trafik dan k6.
providers:
  - name: database
    orgId: 1
    folder: database
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/db
