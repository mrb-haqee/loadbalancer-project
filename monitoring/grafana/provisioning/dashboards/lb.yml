apiVersion: 1

# Dashboard trafik nyata dipisah dari dashboard hasil Run k6
# supaya panel real-time tidak bercampur dengan histori pengujian beban.
providers:
  - name: lb
    orgId: 1
    folder: load-balancer
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/lb
