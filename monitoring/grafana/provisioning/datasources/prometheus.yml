apiVersion: 1

# Bersihkan datasource InfluxDB lama bila volume grafana-data berasal dari versi sebelumnya.
deleteDatasources:
  - name: k6-influxdb
    orgId: 1

# Datasource utama metrik (trafik nyata, database, dan hasil Run k6).
datasources:
  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 2s
