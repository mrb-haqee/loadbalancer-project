apiVersion: 1

# Datasource untuk trafik nyata (Prometheus). Dashboard k6 tetap memakai
# InfluxDB; keduanya hidup berdampingan dengan uid berbeda.
datasources:
  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 2s
