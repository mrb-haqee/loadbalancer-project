<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Load Balancer Dashboard — 3 Server</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: #121b2e;
        --panel-2: #17233a;
        --line: #23324d;
        --text: #e6edf7;
        --muted: #8fa3c0;
        --ok: #34d399;
        --bad: #f87171;
        --accent: #60a5fa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 20% -10%, #17233a 0%, var(--bg) 60%);
        color: var(--text);
        font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
        padding: 32px 20px 56px;
      }
      .wrap { max-width: 1000px; margin: 0 auto; }
      header { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
      h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.2px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0; }
      .pill {
        display: inline-flex; gap: 8px; align-items: center;
        background: var(--panel-2); border: 1px solid var(--line);
        border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--muted);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 24px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
      .card h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
      .card .port { color: var(--muted); font-size: 12px; font-weight: 400; }
      .num { font-size: 34px; font-weight: 650; margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
      .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
      .bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-top: 14px; }
      .bar > span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #22d3ee); transition: width 0.35s ease; }
      .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 8px; }
      .status-ok { color: var(--ok); }
      .status-bad { color: var(--bad); }
      .card.down { border-color: rgba(248, 113, 113, 0.5); background: linear-gradient(180deg, rgba(248,113,113,0.08), transparent 60%), var(--panel); }
      .card.down .bar > span { background: linear-gradient(90deg, #b91c1c, #f87171); }
      .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
      .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
      .stat .num { font-size: 22px; margin: 4px 0 0; }
      footer { color: var(--muted); font-size: 12px; margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
      code { background: var(--panel-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; font-size: 12px; }
      a { color: var(--accent); }
      .error { color: var(--bad); font-size: 12px; margin-top: 8px; word-break: break-word; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Load Balancer Dashboard</h1>
          <p class="sub">3 backend server · dipantau langsung dari <code>/stats</code></p>
        </div>
        <div class="pill"><span class="dot" id="live-dot"></span><span id="live-text">menghubungkan…</span></div>
      </header>

      <div class="summary">
        <div class="stat"><div class="label">Algoritma</div><div class="num" id="algorithm">–</div></div>
        <div class="stat"><div class="label">Backend sehat</div><div class="num" id="healthy">–</div></div>
        <div class="stat"><div class="label">Total request</div><div class="num" id="total">–</div></div>
        <div class="stat"><div class="label">Ditolak (503)</div><div class="num" id="rejected">–</div></div>
      </div>

      <div class="grid" id="cards"></div>

      <footer>
        <span>Auto-refresh 1 detik.</span>
        <span>Data JSON: <a href="/stats">/stats</a></span>
        <span>Coba matikan satu backend, kartunya akan berubah merah.</span>
      </footer>
    </div>

    <script>
      const cardsEl = document.getElementById('cards');
      const el = (id) => document.getElementById(id);
      const cards = new Map();

      function ensureCard(backend) {
        if (cards.has(backend.id)) return cards.get(backend.id);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h2><span class="status">●</span> <span class="name"></span> <span class="port"></span></h2>
          <div class="num"><span class="requests">0</span></div>
          <div class="label">request dilayani</div>
          <div class="bar"><span></span></div>
          <div class="meta"><span class="conn">0 aktif</span><span class="state">–</span></div>
          <div class="error" hidden></div>
        `;
        card.querySelector('.name').textContent = backend.id;
        card.querySelector('.port').textContent = `:${backend.port}`;
        cardsEl.appendChild(card);
        const refs = {
          card,
          status: card.querySelector('.status'),
          requests: card.querySelector('.requests'),
          bar: card.querySelector('.bar > span'),
          conn: card.querySelector('.conn'),
          state: card.querySelector('.state'),
          error: card.querySelector('.error'),
        };
        cards.set(backend.id, refs);
        return refs;
      }

      function render(data) {
        el('algorithm').textContent = data.loadBalancer.algorithm;
        el('healthy').textContent = `${data.healthyCount}/${data.totalCount}`;
        el('total').textContent = data.totals.requests;
        el('rejected').textContent = data.totals.rejected;

        const max = Math.max(1, ...data.backends.map((b) => b.requests));
        for (const backend of data.backends) {
          const refs = ensureCard(backend);
          refs.card.classList.toggle('down', !backend.healthy);
          refs.status.className = `status ${backend.healthy ? 'status-ok' : 'status-bad'}`;
          refs.requests.textContent = backend.requests;
          refs.conn.textContent = `${backend.activeConnections} aktif`;
          refs.state.textContent = backend.healthy ? 'sehat' : 'mati';
          refs.state.className = backend.healthy ? 'status-ok' : 'status-bad';
          refs.bar.style.width = `${Math.round((backend.requests / max) * 100)}%`;
          if (backend.lastError) {
            refs.error.hidden = false;
            refs.error.textContent = backend.lastError;
          } else {
            refs.error.hidden = true;
          }
        }
      }

      async function poll() {
        try {
          const res = await fetch('/stats', { cache: 'no-store' });
          const data = await res.json();
          render(data);
          el('live-dot').style.background = '#34d399';
          el('live-text').textContent = 'terhubung';
        } catch (error) {
          el('live-dot').style.background = '#f87171';
          el('live-text').textContent = 'load balancer tidak merespons';
        }
      }

      poll();
      setInterval(poll, 1000);
    </script>
  </body>
</html>
